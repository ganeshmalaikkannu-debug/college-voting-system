# Active Spring Profile (default to dev)
spring.profiles.active=dev

# Application Name
spring.application.name=college-voting-system

# Server Port
server.port=${SERVER_PORT:8080}

# JWT Secret and Expiration defaults
app.jwt.secret=${JWT_SECRET:dev_default_jwt_secret_key_minimum_32_characters_for_hs256_academic_project!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Admin Dev Seeder Environment Defaults
app.admin.roll=${ADMIN_ROLL:ADM001}
app.admin.password=${ADMIN_PASSWORD:AdminSecure@123}

# SpringDoc / Swagger UI paths
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
